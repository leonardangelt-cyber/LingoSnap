name: Build APK from ZIP

# Upload a .zip with the LingoSnap project into the repo root -> APK is built in Actions.
on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -t ./*.zip | head -n 1)
          echo "Building from: $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
          SETTINGS=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts -not -path "*/__MACOSX/*" | head -n 1)
          [ -n "$SETTINGS" ] || { echo "No settings.gradle.kts found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk "out/LingoSnap-${{ github.run_number }}.apk"

      # GitHub zips artifacts automatically: Actions -> run -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: LingoSnap-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
